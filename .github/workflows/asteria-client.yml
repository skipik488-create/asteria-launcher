name: Asteria Client

on:
  push:
    paths:
      - "apps/asteria-client/**"
      - ".github/workflows/asteria-client.yml"
  pull_request:
    paths:
      - "apps/asteria-client/**"
      - ".github/workflows/asteria-client.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/asteria-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: asteria-client
          path: apps/asteria-client/build/libs/asteria-client-*.jar