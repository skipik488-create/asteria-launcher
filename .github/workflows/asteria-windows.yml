name: Asteria Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/asteria-windows.yml'
      - 'apps/app/**'
      - 'apps/app-frontend/**'
      - 'packages/app-lib/**'
      - 'packages/assets/**'
      - 'packages/ui/**'

permissions:
  contents: read

concurrency:
  group: asteria-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows setup
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable Corepack
        run: corepack enable

      - name: Configure unsigned development build
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          cp packages/app-lib/.env.prod packages/app-lib/.env
          cat > apps/app/tauri-dev.conf.json <<EOF
          {
            "productName": "Asteria Launcher",
            "mainBinaryName": "Asteria Launcher",
            "identifier": "com.asteria.launcher",
            "bundle": {
              "fileAssociations": []
            }
          }
          EOF

      - name: Install dependencies
        run: pnpm install

      - name: Build Windows installer
        shell: pwsh
        run: pnpm --filter=@modrinth/app run tauri build --config tauri-dev.conf.json --verbose --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Asteria-Launcher-Windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
