name: Asteria Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feat/windows-mvp
    paths:
      - 'apps/app/**'
      - 'apps/app-frontend/**'
      - 'packages/app-lib/**'
      - 'packages/ui/**'
      - 'packages/assets/**'
      - '.github/workflows/asteria-windows.yml'
  pull_request:
    paths:
      - 'apps/app/**'
      - 'apps/app-frontend/**'
      - 'packages/app-lib/**'
      - 'packages/ui/**'
      - 'packages/assets/**'
      - '.github/workflows/asteria-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      MODRINTH_API_BASE_URL: https://api.modrinth.com/
      MODRINTH_API_URL: https://api.modrinth.com/v2/
      MODRINTH_API_URL_V3: https://api.modrinth.com/v3/
      MODRINTH_LAUNCHER_META_URL: https://launcher-files.modrinth.com/
      MODRINTH_SOCKET_URL: wss://api.modrinth.com/v3/ws
      MODRINTH_URL: https://modrinth.com/
      SHARED_INSTANCES_API_BASE_URL: https://api.modrinth.com/
      MODRINTH_EXTERNAL_UPDATE_PROVIDER: 'true'
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @modrinth/app-frontend lint
      - run: pnpm --filter @modrinth/app build -- --config tauri-asteria.conf.json --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: asteria-launcher-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/AsteriaLauncher.exe
      - name: Publish downloadable Windows build branch
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:RUNNER_TEMP 'asteria-windows'
          $archive = Join-Path $env:RUNNER_TEMP 'asteria-launcher-windows.zip'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe $staging
          Copy-Item target/release/AsteriaLauncher.exe $staging
          Compress-Archive -Path "$staging/*" -DestinationPath $archive -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin windows-artifacts 2>$null
          if ($LASTEXITCODE -eq 0) {
            git checkout -B windows-artifacts origin/windows-artifacts
          } else {
            git checkout --orphan windows-artifacts
          }
          git rm -rf . 2>$null
          Copy-Item $archive ./asteria-launcher-windows.zip
          @"
          # Asteria Launcher Windows build

          Automated Windows build from ``feat/windows-mvp``.
          Commit: ``${{ github.sha }}``
          "@ | Set-Content -Encoding utf8 README.md
          git add README.md asteria-launcher-windows.zip
          git commit -m "build(windows): publish ${{ github.sha }}"
          git push origin windows-artifacts --force
